{% extends "admin/base.html" %}

{% block title %}Change password – AmberStream{% endblock %}
{% block heading %}Change password{% endblock %}

{% block content %}
  {% if msg %}
    <div class="alert alert--{{ 'ok' if ok else 'err' }}" role="alert" style="margin-bottom:var(--s-5);">{{ msg }}</div>
  {% endif %}

  <form method="POST" class="stack">
    <div class="field">
      <label for="old_password">Current password</label>
      <input id="old_password" name="old_password" type="password"
             autocomplete="current-password" required>
    </div>
    <div class="field">
      <label for="new_password">New password</label>
      <input id="new_password" name="new_password" type="password"
             autocomplete="new-password" minlength="3" required>
      <span class="field__hint">At least 3 characters.</span>
    </div>
    <div class="field">
      <label for="confirm_password">Confirm new password</label>
      <input id="confirm_password" name="confirm_password" type="password"
             autocomplete="new-password" minlength="3" required>
    </div>
    <button type="submit" class="btn btn--primary btn--block" style="margin-top:var(--s-2);">
      Change password
    </button>
  </form>

  <div class="admin-foot">
    <a class="btn btn--secondary" href="{{ url_for('plans_admin') }}">← Back to rates</a>
    <a class="btn btn--danger" href="{{ url_for('logout') }}">Log out</a>
  </div>
{% endblock %}
